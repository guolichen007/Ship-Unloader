name: ROS2 Humble review tools
on:
  push:
  pull_request:
jobs:
  humble:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical and build dependencies
        run: |
          apt-get update
          apt-get install -y libeigen3-dev python3-colcon-common-extensions python3-pip python3-venv python3-pytest ros-humble-ament-cmake-python ros-humble-ament-cmake-pytest
      - name: Create isolated numerical runtime
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements-ros.txt
      - name: Build C++ core and ROS2 Python package
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source .venv/bin/activate
          export PYTHONNOUSERSITE=1 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
          colcon build --base-paths ship_perception --symlink-install --packages-select ship_perception --cmake-args -DM0_WITH_PCL=OFF -DPython3_EXECUTABLE="$VIRTUAL_ENV/bin/python"
      - name: Unit, observed topology, C++ and real DDS tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          source .venv/bin/activate
          export PYTHONNOUSERSITE=1 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
          python3 -s -m unittest discover -s ship_perception/tests -p 'test_*.py'
          colcon test --base-paths ship_perception --packages-select ship_perception --ctest-args -E '^(g5|v15_quick)$'
          colcon test-result --all --verbose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: humble-test-results
          path: |
            log/
            build/ship_perception/Testing/
            build/ship_perception/test_results/
