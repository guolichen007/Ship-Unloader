name: ROS2 Humble review tools
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  humble:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy@sha256:d9f14e84747bea639a65e00cf871d2c68ae55385d2acf6239614de0cadb41dcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified upstream
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Record exact tested source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/ship-review-ci-evidence"
          echo "SHIP_CI_EVIDENCE=$RUNNER_TEMP/ship-review-ci-evidence" >> "$GITHUB_ENV"
          git rev-parse HEAD | tee "$RUNNER_TEMP/ship-review-ci-evidence/ci-head.txt"
          test -z "$(git status --porcelain)"
      - name: Install numerical and build dependencies
        run: |
          apt-get update
          apt-get install -y libeigen3-dev python3-colcon-common-extensions python3-pip python3-venv python3-pytest ros-humble-ament-cmake-python ros-humble-ament-cmake-pytest fonts-noto-cjk
      - name: Create isolated numerical runtime
        run: |
          python3 -m venv --system-site-packages .local/ros2-venv
          .local/ros2-venv/bin/python -m pip install -r requirements-ros.txt
          .local/ros2-venv/bin/python -m pip freeze > "$RUNNER_TEMP/ship-review-ci-evidence/ci-pip-freeze.txt"
          dpkg-query -W > "$RUNNER_TEMP/ship-review-ci-evidence/ci-dpkg-versions.txt"
      - name: Build C++ core and ROS2 Python package
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source .local/ros2-venv/bin/activate
          export PYTHONNOUSERSITE=1 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
          colcon build --base-paths ship_perception --symlink-install --packages-select ship_perception --cmake-args -DM0_WITH_PCL=OFF -DPython3_EXECUTABLE="$VIRTUAL_ENV/bin/python"
      - name: Unit, observed topology, C++ and real DDS tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          source .local/ros2-venv/bin/activate
          export PYTHONNOUSERSITE=1 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
          python3 -s -m unittest discover -s ship_perception/tests -p 'test_*.py'
          python3 -s -m pytest -q ship_perception/tests/test_r3k_review_layers.py
          python3 -s ship_perception/tools/verify_v14_frozen.py
          python3 -s -c 'from ship_perception.perception.legacy_expert import verify_legacy_b2_core; print(verify_legacy_b2_core())'
          colcon test --base-paths ship_perception --packages-select ship_perception --ctest-args -E '^v15_quick$'
          colcon test-result --all --verbose
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, verified upstream
        if: always()
        with:
          name: humble-test-results
          path: |
            ${{ env.SHIP_CI_EVIDENCE }}/
            log/
            build/ship_perception/Testing/
            build/ship_perception/test_results/
